<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PPT to TXT</title>
<style>
body{font-family:system-ui,sans-serif;max-width:560px;margin:0 auto;padding:8px;line-height:1.4}
button,label.b{display:block;width:100%;padding:14px;margin:10px 0;font-size:17px;border:0;border-radius:10px;background:#3498db;color:#fff;text-align:center;box-sizing:border-box}
button:disabled{background:#999}
#log{font:13px monospace;white-space:pre-wrap;max-height:40vh;overflow:auto;background:#f3f3f3;padding:8px;border-radius:8px}
progress{width:100%}
</style></head><body>

<p>Runs fully on this device. Nothing is uploaded. Works with .pptx / .ppsx / .pptm (not old .ppt) and .pdf (text-based; scanned PDFs have no text to extract).</p>
<label class="b">1. Choose files (select many)
<input id="f" type="file" multiple accept=".pptx,.ppsx,.pptm,.potx,.pdf,application/pdf" hidden></label>
<label><input type="checkbox" id="notes"> include speaker notes (PPTX)</label>
<progress id="p" value="0" max="1"></progress>
<button id="go" disabled>2. Convert</button>
<button id="dlzip" disabled>Download ZIP (one .txt per file)</button>
<button id="dlall" disabled>Download one combined .txt</button>
<div id="log"></div>
<script>
const $=id=>document.getElementById(id), log=m=>{$('log').textContent+=m+"\n";$('log').scrollTop=1e9};
let files=[], results=[];
$('f').onchange=e=>{files=[...e.target.files];$('go').disabled=!files.length;log(files.length+" file(s) selected")};

// ---- minimal ZIP reader (central directory + raw deflate) ----
async function inflate(u8){
  const ds=new DecompressionStream('deflate-raw');
  const s=new Blob([u8]).stream().pipeThrough(ds);
  return new Uint8Array(await new Response(s).arrayBuffer());
}
async function readZip(buf){
  const v=new DataView(buf), u8=new Uint8Array(buf);
  let e=buf.byteLength-22;
  while(e>=0&&v.getUint32(e,true)!==0x06054b50)e--;
  if(e<0)throw new Error("not a zip/pptx");
  let n=v.getUint16(e+10,true), p=v.getUint32(e+16,true), ent={};
  for(let i=0;i<n;i++){
    const m=v.getUint16(p+10,true), cs=v.getUint32(p+20,true), nl=v.getUint16(p+28,true),
          xl=v.getUint16(p+30,true), cl=v.getUint16(p+32,true), lo=v.getUint32(p+42,true);
    const name=new TextDecoder().decode(u8.subarray(p+46,p+46+nl));
    ent[name]={m,cs,lo}; p+=46+nl+xl+cl;
  }
  return {names:Object.keys(ent), async get(name){
    const {m,cs,lo}=ent[name]; const ln=v.getUint16(lo+26,true), lx=v.getUint16(lo+28,true);
    const d=u8.subarray(lo+30+ln+lx, lo+30+ln+lx+cs);
    return new TextDecoder().decode(m===0?d:await inflate(d));
  }};
}
const A="http://schemas.openxmlformats.org/drawingml/2006/main";
function xmlText(xml){
  const doc=new DOMParser().parseFromString(xml,"application/xml"), out=[];
  for(const p of doc.getElementsByTagNameNS(A,"p")){
    let s="";
    const w=document.createTreeWalker(p,NodeFilter.SHOW_ELEMENT);
    for(let n=w.currentNode;n;n=w.nextNode()){
      if(n.localName==="t"&&n.namespaceURI===A)s+=n.textContent;
      else if(n.localName==="br")s+="\n"; else if(n.localName==="tab")s+="\t";
    }
    s=s.trim(); if(s)out.push(s);
  }
  return out.join("\n");
}
const num=s=>+(s.match(/(\d+)\.xml$/)||[0,0])[1];
async function convert(buf,notes){
  const z=await readZip(buf), out=[];
  const slides=z.names.filter(n=>/^ppt\/slides\/slide\d+\.xml$/.test(n)).sort((a,b)=>num(a)-num(b));
  let i=0;
  for(const s of slides){
    out.push("=== Slide "+(++i)+" ===");
    const t=xmlText(await z.get(s)); if(t)out.push(t);
    if(notes){
      const rel=s.replace("slides/","slides/_rels/")+".rels";
      if(z.names.includes(rel)){
        const m=(await z.get(rel)).match(/Target="\.\.\/notesSlides\/(notesSlide\d+\.xml)"/);
        if(m&&z.names.includes("ppt/notesSlides/"+m[1])){
          const nt=xmlText(await z.get("ppt/notesSlides/"+m[1])); if(nt)out.push("[Notes]\n"+nt);
        }
      }
    }
    out.push("");
  }
  return out.join("\n").trim()+"\n";
}

// ---- PDF -> text (PDF.js, bundled locally in ./pdfjs, loaded only when a PDF is converted) ----
let pdfjsP=null;
function loadPdfjs(){
  if(!pdfjsP)pdfjsP=import('./pdfjs/pdf.min.mjs').then(m=>{m.GlobalWorkerOptions.workerSrc='./pdfjs/pdf.worker.min.mjs';return m})
    .catch(e=>{pdfjsP=null;throw new Error("PDF reader could not load ("+e.message+")")});
  return pdfjsP;
}
async function convertPdf(buf){
  const pdfjs=await loadPdfjs();
  const task=pdfjs.getDocument({data:new Uint8Array(buf),isEvalSupported:false});
  let doc;
  try{ doc=await task.promise; }
  catch(e){ task.destroy(); throw new Error(e.name==="PasswordException"?"password-protected PDF":e.message); }
  const out=[]; let chars=0;
  for(let i=1;i<=doc.numPages;i++){
    const page=await doc.getPage(i), tc=await page.getTextContent();
    let s="";
    for(const it of tc.items){ if(typeof it.str!=="string")continue; s+=it.str; if(it.hasEOL)s+="\n"; }
    s=s.replace(/[ \t]+\n/g,"\n").replace(/\n{3,}/g,"\n\n").trim();
    chars+=s.length; out.push("=== Page "+i+" ===");
    if(s)out.push(s);
    out.push(""); page.cleanup();
  }
  await task.destroy();
  if(!chars)throw new Error("no text found (scanned/image PDF, needs OCR)");
  return out.join("\n").trim()+"\n";
}

// ---- minimal ZIP writer (stored) ----
const crcT=(()=>{const t=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
const crc=u=>{let c=~0;for(let i=0;i<u.length;i++)c=crcT[(c^u[i])&255]^(c>>>8);return ~c>>>0};
function makeZip(items){
  const parts=[], cd=[]; let off=0; const enc=new TextEncoder();
  for(const {name,text} of items){
    const nb=enc.encode(name), d=enc.encode(text), c=crc(d);
    const h=new DataView(new ArrayBuffer(30)); h.setUint32(0,0x04034b50,true); h.setUint16(4,20,true);
    h.setUint16(6,0x0800,true); h.setUint32(14,c,true); h.setUint32(18,d.length,true); h.setUint32(22,d.length,true); h.setUint16(26,nb.length,true);
    parts.push(h.buffer,nb,d);
    const r=new DataView(new ArrayBuffer(46)); r.setUint32(0,0x02014b50,true); r.setUint16(4,20,true); r.setUint16(6,20,true);
    r.setUint16(8,0x0800,true); r.setUint32(16,c,true); r.setUint32(20,d.length,true); r.setUint32(24,d.length,true); r.setUint16(28,nb.length,true); r.setUint32(42,off,true);
    cd.push(r.buffer,nb); off+=30+nb.length+d.length;
  }
  const cdSize=cd.reduce((a,b)=>a+b.byteLength,0);
  const e=new DataView(new ArrayBuffer(22)); e.setUint32(0,0x06054b50,true); e.setUint16(8,items.length,true); e.setUint16(10,items.length,true); e.setUint32(12,cdSize,true); e.setUint32(16,off,true);
  return new Blob([...parts,...cd,e.buffer],{type:"application/zip"});
}
function save(blob,name){const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),20000)}

$('go').onclick=async()=>{
  $('go').disabled=true; results=[]; $('p').max=files.length; $('p').value=0;
  const seen={};
  for(const f of files){
    try{
      const isPdf=/\.pdf$/i.test(f.name)||f.type==="application/pdf";
      const text=isPdf?await convertPdf(await f.arrayBuffer()):await convert(await f.arrayBuffer(),$('notes').checked);
      let base=f.name.replace(/\.[^.]+$/,""); seen[base]=(seen[base]||0)+1; if(seen[base]>1)base+="_"+seen[base];
      results.push({name:base+".txt",src:f.name,text}); log("ok  "+f.name);
    }catch(e){log("FAIL "+f.name+": "+e.message)}
    $('p').value++; await new Promise(r=>setTimeout(r));
  }
  log("Done: "+results.length+"/"+files.length);
  $('go').disabled=false; $('dlzip').disabled=$('dlall').disabled=!results.length;
};
$('dlzip').onclick=()=>save(makeZip(results),"converted_txt.zip");
$('dlall').onclick=()=>save(new Blob([results.map(r=>"##### "+r.src+" #####\n"+r.text).join("\n")],{type:"text/plain"}),"all_text.txt");
</script></body></html>
